<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>Book List</title>
</head>
<body>
  <div id="auth-section" class="container">
    <h1>Welcome to Booklist</h1>
    <div id="auth-error" class="auth-error"></div>
    <form id="login-form">
      <h2>Login</h2>
      <div class="email">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="u-full-width" required>
      </div>
      <div class="password">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="u-full-width" required>
      </div>
      <div>
        <input type="submit" value="Login" class="u-full-width">
      </div>
      <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
    </form>

    <form id="signup-form" style="display:none">
      <h2>Sign Up</h2>
      <div class="name">
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" class="u-full-width">
      </div>
      <div class="email">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" class="u-full-width" required>
      </div>
      <div class="password">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" class="u-full-width" required>
      </div>
      <div>
        <input type="submit" value="Create account" class="u-full-width">
      </div>
      <p>Already have an account? <a href="#" id="show-login">Log in</a></p>
    </form>
  </div>

  <div id="books-section" class="container" style="display:none">
    <div style="display:flex; align-items:center; justify-content:space-between">
      <h1>Add Book</h1>
      <button id="logout-btn">Logout</button>
    </div>
    <form id="book-form">
            <div class="title">
                <label for="title">Title</label>
                <input type="text" id="title" class="u-full-width">
                <span class="titleAlert"></span>
            </div>
            <div class="author">
                <label for="author">Author</label>
                <input type="text" id="author" class="u-full-width">
                <span class="authorAlert"></span>
            </div>
            <div class="isbn">
                <label for="isbn">ISBN#</label>
                <input type="text" id="isbn" class="u-full-width">
                <span class="isbnAlert"></span>
            </div>
            <div>
                <input type="submit" value="Submit" class="u-full-width">
            </div>
        </form>
        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="book-list">
                <!--Add dynamically by js-->
            </tbody>
        </table>
  </div>
  <script src="app.js"></script>
</body>
</html>
