<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css">
  <title>Book List</title>
</head>
<body>
  <div id="auth" class="container">
    <h1>Welcome to Book List</h1>
    <div class="auth-toggle">
      <button id="show-login" type="button">Log in</button>
      <button id="show-signup" type="button">Sign up</button>
    </div>

    <form id="login-form">
      <h2>Log in</h2>
      <div class="email">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="password">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>
      </div>
      <div>
        <input type="submit" value="Log in">
      </div>
      <div id="login-error" class="error"></div>
    </form>

    <form id="signup-form" class="hidden">
      <h2>Sign up</h2>
      <div class="name">
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" required>
      </div>
      <div class="email">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required>
      </div>
      <div class="password">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required>
      </div>
      <div>
        <input type="submit" value="Create account">
      </div>
      <div id="signup-error" class="error"></div>
    </form>
  </div>

  <div id="app" class="container hidden">
    <div class="app-header">
      <h1>Add Book</h1>
      <div class="user-controls">
        <span id="user-info"></span>
        <button id="logout-btn" type="button">Log out</button>
      </div>
    </div>
        <form id="book-form">
            <div class="title">
                <label for="title">Title</label>
                <input type="text" id="title" class="u-full-width" required>
                <span class="titleAlert"></span>
            </div>
            <div class="author">
                <label for="author">Author</label>
                <input type="text" id="author" class="u-full-width" required>
                <span class="authorAlert"></span>
            </div>
            <div class="isbn">
                <label for="isbn">ISBN#</label>
                <input type="text" id="isbn" class="u-full-width" required>
                <span class="isbnAlert"></span>
            </div>
            <div>
                <input type="submit" value="Submit" class="u-full-width">
            </div>
        </form>
        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="book-list">
                <!--Add dynamically by js-->
            </tbody>
        </table>
  </div>
  <script src="app.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
