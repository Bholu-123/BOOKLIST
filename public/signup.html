<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="/style.css" />
  <title>Sign up</title>
</head>
<body>
  <div class="container">
    <nav>
      <div>
        <a href="/">Home</a>
      </div>
      <div>
        <a href="/login.html">Login</a>
      </div>
    </nav>

    <h1>Sign up</h1>
    <div id="error"></div>
    <form id="signup-form">
      <div class="email">
        <label for="email">Email</label>
        <input type="email" id="email" class="u-full-width" required />
      </div>
      <div class="password">
        <label for="password">Password</label>
        <input type="password" id="password" class="u-full-width" required />
      </div>
      <div>
        <input type="submit" value="Create account" class="u-full-width" />
      </div>
    </form>
  </div>

  <script src="/signup.js"></script>
</body>
</html>
